name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with or without leading v (for example 1.13.9)'
        required: true
        type: string

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    name: Build Plugin Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      
      - name: Get version from input
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract changelog section for this version
          # For v1.5.0 (first release), include everything from [1.5.0] to end
          # For future releases, extract only the section between [X.Y.Z] and next version
          VERSION="${{ steps.version.outputs.VERSION }}"
          
          # Try to extract section for this version
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')
          
          # If empty (no next version marker), get from version to end
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(sed -n "/## \[$VERSION\]/,\$p" CHANGELOG.md)
          fi
          
          # Save to file (multiline)
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          # Set output (GitHub Actions multiline)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction
      
      - name: Create release directory
        run: |
          mkdir -p release
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='node_modules' \
                    --exclude='skills' \
                    --exclude='tests' \
                    --exclude='docs/planning' \
                    --exclude='docs/development' \
                    --exclude='docs/testing' \
                    --exclude='.gitignore' \
                    --exclude='.gitattributes' \
                    --exclude='composer.json' \
                    --exclude='composer.lock' \
                    --exclude='phpunit.xml' \
                    --exclude='phpunit.xml.dist' \
                    --exclude='pest.php' \
                    --exclude='docker-compose.yml' \
                    --exclude='Dockerfile' \
                    --exclude='.env.example' \
                    --exclude='release' \
                    . release/polytrans/
      
      - name: Create ZIP archives
        run: |
          cd release
          # Create version-specific ZIP for archival
          zip -r polytrans-${{ steps.version.outputs.VERSION }}.zip polytrans/
          # Create generic ZIP for easy WordPress installation
          zip -r polytrans.zip polytrans/
          cd ..
      
      - name: Generate checksums
        run: |
          cd release
          sha256sum polytrans-${{ steps.version.outputs.VERSION }}.zip > polytrans-${{ steps.version.outputs.VERSION }}.zip.sha256
          sha256sum polytrans.zip > polytrans.zip.sha256
          cd ..
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: |
            release/polytrans.zip
            release/polytrans.zip.sha256
            release/polytrans-${{ steps.version.outputs.VERSION }}.zip
            release/polytrans-${{ steps.version.outputs.VERSION }}.zip.sha256
          body: |
            ## PolyTrans v${{ steps.version.outputs.VERSION }}
            
            ### 📦 Installation
            
            **For WordPress Installation (Recommended):**
            1. Download `polytrans.zip` ⬅️ Use this one!
            2. Upload to WordPress via Plugins > Add New > Upload Plugin
            3. Activate the plugin
            
            **For Archival/Version Tracking:**
            - Download `polytrans-${{ steps.version.outputs.VERSION }}.zip` if you need version-specific archive
            
            **Note:** Both ZIPs contain identical files. The `polytrans.zip` ensures WordPress installs the plugin in the correct `polytrans/` directory (not `polytrans-1.5.0/`).
            
            ### ✅ What's Included
            
            - All plugin files
            - Composer dependencies (vendor/)
            - Production-optimized autoloader
            
            ### 🔐 Verification
            
            Verify the download integrity:
            ```bash
            # For WordPress installation:
            sha256sum -c polytrans.zip.sha256
            
            # For versioned archive:
            sha256sum -c polytrans-${{ steps.version.outputs.VERSION }}.zip.sha256
            ```
            
            ---
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            **Full Changelog:** [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifact for debugging
        uses: actions/upload-artifact@v4
        with:
          name: polytrans-${{ steps.version.outputs.VERSION }}
          path: release/polytrans.zip
          retention-days: 30
