stages:
  - test
  - build
  - release
  - sync

variables:
  PHP_VERSION: "8.1"
  # Both empty on purpose = current release. A pinned pair hides exactly the failures
  # this gate exists to catch: `outdated_tested_upto_header` is an ERROR the moment
  # WordPress ships a new version, and Plugin Check adds sniffs between releases. Pinned
  # to 6.8 / 2.0.0, the pipeline stayed green while the reviewer's run on 7.1 reported an
  # error. Pin them again only to reproduce a specific historical run.
  WP_CORE_VERSION: ""
  PLUGIN_CHECK_VERSION: ""
  # A previous Docker job may have left root-owned dependency files in the
  # reused shell-runner checkout. The gate jobs clean those exact paths below.
  GIT_CLEAN_FLAGS: "none"

.shell-checkout-cleanup:
  before_script:
    - >
      docker run --rm --user root --entrypoint sh
      -v "${CI_PROJECT_DIR}:/cleanup"
      alpine:3.20
      -c "rm -rf /cleanup/vendor /cleanup/pcp /cleanup/composer.phar /cleanup/pcp-report.csv"

# ==============================================================================
# Test Stage - runs on main branch, merge requests and version tags
# ==============================================================================

unit-tests:
  stage: test
  tags:
    - vps
  extends: .shell-checkout-cleanup
  script:
    - >
      docker run --rm
      -v "${CI_PROJECT_DIR}:/src:ro"
      php:8.3-cli
      sh -c "apt-get update && apt-get install -y unzip git libxml2-dev libonig-dev && docker-php-ext-install xml dom simplexml mbstring && cp -r /src /work && cd /work && curl -sS https://getcomposer.org/installer | php && php composer.phar install --no-interaction && php -d memory_limit=512M ./vendor/bin/pest --testsuite=Unit --colors=never && php -d memory_limit=512M ./vendor/bin/pest --testsuite=Architecture --colors=never"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/

php-syntax-check:
  stage: test
  tags:
    - vps
  extends: .shell-checkout-cleanup
  script:
    - >
      docker run --rm
      -v "${CI_PROJECT_DIR}:/src:ro"
      php:8.3-cli
      sh -c "find /src/includes -name '*.php' -print0 | xargs -0 -n1 php -l && php -l /src/polytrans.php"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/

# Coding standards. Blocking on errors, warnings reported but tolerated —
# WordPress.DB warnings about direct queries are expected for four custom tables.
#
# This job is the reason the March review fixes came back: nothing enforced them.
# Do not add allow_failure here.
# Shell executor + Docker: mount the checkout read-only and run Composer in /work.
phpcs:
  stage: test
  tags:
    - vps
  extends: .shell-checkout-cleanup
  script:
    - >
      docker run --rm
      -v "${CI_PROJECT_DIR}:/src:ro"
      php:8.3-cli
      sh -c "apt-get update -qq && apt-get install -y -qq unzip git libxml2-dev libonig-dev >/dev/null
      && docker-php-ext-install xml dom simplexml mbstring >/dev/null
      && cp -r /src /work
      && cd /work
      && curl -sS https://getcomposer.org/installer | php
      && php composer.phar install --no-interaction --quiet
      && php -d memory_limit=1G vendor/bin/phpcs --standard=phpcs.xml --report=full --no-colors --warning-severity=0"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/

# The scan WordPress.org reviewers run on a submission. Blocking on ERROR only;
# warnings are printed for information.
plugin-check:
  stage: test
  tags:
    - vps
  extends: .shell-checkout-cleanup
  # `services:` is deliberately not used: this runner is a shell executor (every other
  # job here shells out to `docker run`), and services are silently ignored there.
  script:
    - export NET="pcp-${CI_JOB_ID}"
    - export DB="pcp-mysql-${CI_JOB_ID}"
    - docker network create "$NET"
    - docker run -d --name "$DB" --network "$NET" -e MYSQL_ROOT_PASSWORD=pcp -e MYSQL_DATABASE=wp mysql:5.7
    - |
      for i in $(seq 1 30); do
        docker exec "$DB" mysqladmin ping -uroot -ppcp --silent >/dev/null 2>&1 && break
        sleep 2
      done
    # The plugin boots through vendor/autoload.php during activation. Install only
    # production dependencies before copying the distribution-shaped tree.
    # Keep the complete staging tree outside the checkout: WP-CLI runs as root
    # and would otherwise leave root-owned WordPress files under CI_PROJECT_DIR.
    - export PCP_ROOT="/tmp/polytrans-pcp-${CI_JOB_ID}"
    - mkdir -p "$PCP_ROOT/source" "$PCP_ROOT/wp-content/plugins"
    - rsync -a --exclude='/vendor/' . "$PCP_ROOT/source/"
    - composer install --working-dir="$PCP_ROOT/source" --no-dev --optimize-autoloader --no-interaction
    - rsync -a --exclude-from="$PCP_ROOT/source/.distignore" "$PCP_ROOT/source/" "$PCP_ROOT/wp-content/plugins/polytrans/"
    - >
      docker run --rm --network "$NET"
      -v "$PCP_ROOT:/var/www/html"
      -w /var/www/html
      --user root
      wordpress:cli-php8.2
      sh -c "php -d memory_limit=2G /usr/local/bin/wp core download ${WP_CORE_VERSION:+--version=$WP_CORE_VERSION} --allow-root --force
      && php -d memory_limit=2G /usr/local/bin/wp config create --allow-root --dbname=wp --dbuser=root --dbpass=pcp --dbhost=$DB --skip-check --force
      && php -d memory_limit=2G /usr/local/bin/wp core install --allow-root --url=http://example.test --title=pcp --admin_user=a --admin_password=a --admin_email=a@example.test --skip-email
      && php -d memory_limit=2G /usr/local/bin/wp plugin install plugin-check ${PLUGIN_CHECK_VERSION:+--version=$PLUGIN_CHECK_VERSION} --allow-root --activate
      && php -d memory_limit=2G /usr/local/bin/wp plugin check polytrans --allow-root --exclude-directories=vendor,node_modules --format=csv"
      | tee pcp-report.csv
    - |
      ERRORS=$(grep -c ',ERROR,' pcp-report.csv || true)
      echo "Plugin Check errors: ${ERRORS}"
      if [ "${ERRORS}" -ne 0 ]; then
        echo "❌ Plugin Check reported ${ERRORS} error(s):"
        awk '/^FILE:/{f=$2} /,ERROR,/{print f" :: "$0}' pcp-report.csv
        exit 1
      fi
      echo "✅ Plugin Check: 0 errors"
  after_script:
    - docker rm -f "pcp-mysql-${CI_JOB_ID}" || true
    - docker network rm "pcp-${CI_JOB_ID}" || true
    - docker run --rm --user root --entrypoint sh -v "/tmp/polytrans-pcp-${CI_JOB_ID}:/cleanup" wordpress:cli-php8.2 -c "rm -rf /cleanup/* /cleanup/.[!.]* /cleanup/..?*" || true
    - rmdir "/tmp/polytrans-pcp-${CI_JOB_ID}" || true
  artifacts:
    when: always
    paths:
      - pcp-report.csv
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v/

# ==============================================================================
# Build Stage - triggered only by version tags
# ==============================================================================

# Build plugin release (triggered only by version tags)
build:
  stage: build
  tags:
    - vps
  # A tag must be built only after the same tagged commit passes every blocking gate.
  needs:
    - job: unit-tests
    - job: php-syntax-check
    - job: phpcs
    - job: plugin-check
  before_script:
    - echo "Building PolyTrans release..."
    - php --version
    - composer --version
  script:
    # Get version from tag
    - export VERSION=${CI_COMMIT_TAG#v}
    - echo "Building version $VERSION"

    # Install Composer dependencies (production only)
    - composer install --no-dev --optimize-autoloader --no-interaction

    # Create release directory. The exclusion list lives in .distignore — one file,
    # so that this job and the package-lint job cannot disagree about it.
    - mkdir -p release
    - rsync -av --exclude-from=.distignore . release/polytrans/

    # Refuse to ship development leftovers. Guideline check, not a style preference:
    # Plugin Check reports hidden files as an ERROR, and a dangling symlink breaks
    # unzip on some hosts.
    - |
      FAILED=0
      # vendor/ is pruned: a dependency shipping its own .gitignore is not our doing,
      # and Plugin Check does not flag it either.
      HIDDEN=$(find release/polytrans -path release/polytrans/vendor -prune -o -name '.*' -not -name '.' -print)
      if [ -n "$HIDDEN" ]; then
        echo "❌ Hidden files in package:"; echo "$HIDDEN"; FAILED=1
      fi
      if find release/polytrans -xtype l -print | grep -q .; then
        echo "❌ Broken symlinks in package:"; find release/polytrans -xtype l; FAILED=1
      fi
      if find release/polytrans -type l -print | grep -q .; then
        echo "❌ Symlinks in package:"; find release/polytrans -type l; FAILED=1
      fi
      if [ ! -f release/polytrans/readme.txt ]; then
        echo "❌ readme.txt missing from package"; FAILED=1
      fi
      for f in CLAUDE.md AGENTS.md CONTEXT.md Makefile phpcs.xml docker-compose.test.yml; do
        if [ -e "release/polytrans/$f" ]; then echo "❌ Development file in package: $f"; FAILED=1; fi
      done
      if [ "$FAILED" -ne 0 ]; then echo "Package contents rejected — fix .distignore"; exit 1; fi
      echo "✅ Package contents clean"

    # Version consistency: plugin header, constant, readme stable tag and changelog
    # must all name the tag being built.
    - |
      HDR=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9][0-9A-Za-z.\-]*' polytrans.php)
      CONST=$(grep -m1 -oP "POLYTRANS_VERSION',\s*'\K[0-9][0-9A-Za-z.\-]*" polytrans.php)
      TAG=$(grep -m1 -oP '^Stable tag:\s*\K[0-9][0-9A-Za-z.\-]*' release/polytrans/readme.txt)
      echo "tag=$VERSION header=$HDR const=$CONST stable_tag=$TAG"
      if [ "$HDR" != "$VERSION" ] || [ "$CONST" != "$VERSION" ] || [ "$TAG" != "$VERSION" ]; then
        echo "❌ Version mismatch between git tag, plugin header, POLYTRANS_VERSION and readme.txt Stable tag"; exit 1
      fi
      if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
        echo "❌ CHANGELOG.md has no section for $VERSION"; exit 1
      fi
      echo "✅ Version metadata consistent"

    # Create ZIP archives
    - cd release
    - zip -r polytrans-${VERSION}.zip polytrans/
    - zip -r polytrans.zip polytrans/
    - cd ..

    # Generate checksums
    - cd release
    - sha256sum polytrans-${VERSION}.zip > polytrans-${VERSION}.zip.sha256
    - sha256sum polytrans.zip > polytrans.zip.sha256
    - cd ..

    - echo "✅ Build complete! Archives created:"
    - ls -lh release/*.zip

    # Upload to Package Registry (stable URLs, no job ID)
    - |
      for FILE in polytrans.zip polytrans.zip.sha256 polytrans-${VERSION}.zip polytrans-${VERSION}.zip.sha256; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "release/${FILE}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/polytrans/${VERSION}/${FILE}"
      done
    - |
      for FILE in polytrans.zip polytrans.zip.sha256; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "release/${FILE}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/polytrans/latest/${FILE}"
      done
    - echo "✅ Uploaded to Package Registry"
  artifacts:
    paths:
      - release/*.zip
      - release/*.sha256
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# ==============================================================================
# Sync Stage - mirrors successful main pushes to GitHub
# ==============================================================================

sync-github-main:
  stage: sync
  tags:
    - vps
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${GITHUB_TREETANK_TOKEN:-}" ]; then
        echo "GITHUB_TREETANK_TOKEN must be configured in GitLab CI variables." >&2
        exit 1
      fi
    - git checkout -B main "$CI_COMMIT_SHA"
    - git push --force "https://${GITHUB_TREETANK_TOKEN}@github.com/treetank-net/polytrans.git" main
    - echo "✅ Synced main to GitHub repository treetank-net/polytrans"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/

sync-github-tag:
  stage: build
  tags:
    - vps
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "${GITHUB_TREETANK_TOKEN:-}" ]; then
        echo "GITHUB_TREETANK_TOKEN must be configured in GitLab CI variables." >&2
        exit 1
      fi
    - git push --force "https://${GITHUB_TREETANK_TOKEN}@github.com/treetank-net/polytrans.git" "${CI_COMMIT_TAG}"
    - echo "✅ Synced tag ${CI_COMMIT_TAG} to GitHub"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Create GitHub Release with ZIP assets
release-github:
  stage: release
  tags:
    - vps
  needs:
    - job: build
      artifacts: true
    - job: sync-github-tag
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - |
      if [ -z "${GITHUB_TREETANK_TOKEN:-}" ]; then
        echo "GITHUB_TREETANK_TOKEN must be configured in GitLab CI variables." >&2
        exit 1
      fi

    # Extract changelog for this version
    - |
      if [ -f CHANGELOG.md ]; then
        CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,\$p" CHANGELOG.md)
        fi
      else
        CHANGELOG="Release v${VERSION}"
      fi

    # Create release description
    - |
      cat > /tmp/github_release_description.md << 'RELEASE_EOF'
      ## PolyTrans v${VERSION}

      ### 📦 Installation

      **For WordPress Installation (Recommended):**
      1. Download `polytrans.zip` ⬅️ Use this one!
      2. Upload to WordPress via Plugins > Add New > Upload Plugin
      3. Activate the plugin

      **For Archival/Version Tracking:**
      - Download `polytrans-${VERSION}.zip` if you need version-specific archive

      **Note:** Both ZIPs contain identical files. The `polytrans.zip` ensures WordPress installs the plugin in the correct `polytrans/` directory.

      ### ✅ What's Included

      - All plugin files
      - Composer dependencies (vendor/)
      - Production-optimized autoloader

      ### 🔐 Verification

      Verify the download integrity:
      ```bash
      # For WordPress installation:
      sha256sum -c polytrans.zip.sha256

      # For versioned archive:
      sha256sum -c polytrans-${VERSION}.zip.sha256
      ```

      ---

      RELEASE_EOF
    - echo "$CHANGELOG" > /tmp/github_changelog.txt
    - cat /tmp/github_changelog.txt >> /tmp/github_release_description.md
    - |
      cat >> /tmp/github_release_description.md << 'FOOTER_EOF'

      ---

      **Full Changelog:** [CHANGELOG.md](https://github.com/treetank-net/polytrans/blob/main/CHANGELOG.md)
      FOOTER_EOF
    - sed -i "s/\${VERSION}/$VERSION/g" /tmp/github_release_description.md

    # Delete existing GitHub release for this tag (if any)
    - |
      EXISTING=$(curl --silent --show-error \
        --header "Authorization: token ${GITHUB_TREETANK_TOKEN}" \
        "https://api.github.com/repos/treetank-net/polytrans/releases/tags/${CI_COMMIT_TAG}")
      EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')
      if [ -n "$EXISTING_ID" ]; then
        echo "Deleting existing release $EXISTING_ID..."
        curl --fail --silent --show-error \
          --request DELETE \
          --header "Authorization: token ${GITHUB_TREETANK_TOKEN}" \
          "https://api.github.com/repos/treetank-net/polytrans/releases/${EXISTING_ID}"
      fi

    # Create GitHub release
    - |
      RELEASE_RESPONSE=$(curl --fail --silent --show-error \
        --request POST \
        --header "Authorization: token ${GITHUB_TREETANK_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"tag_name\": \"${CI_COMMIT_TAG}\",
          \"name\": \"PolyTrans v${VERSION}\",
          \"body\": $(cat /tmp/github_release_description.md | jq -Rs .)
        }" \
        "https://api.github.com/repos/treetank-net/polytrans/releases")
      UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')
      echo "Upload URL: $UPLOAD_URL"

    # Upload release assets
    - ls -la release/
    - |
      for FILE in polytrans.zip polytrans-${VERSION}.zip polytrans.zip.sha256 polytrans-${VERSION}.zip.sha256; do
        if [ ! -f "release/${FILE}" ]; then
          echo "⚠️ Skipping ${FILE} (not found)"
          continue
        fi
        CTYPE="application/octet-stream"
        case "$FILE" in
          *.zip) CTYPE="application/zip" ;;
          *.sha256) CTYPE="text/plain" ;;
        esac
        echo "Uploading ${FILE} (${CTYPE})..."
        curl --fail --silent --show-error \
          --request POST \
          --header "Authorization: token ${GITHUB_TREETANK_TOKEN}" \
          --header "Content-Type: ${CTYPE}" \
          --data-binary "@release/${FILE}" \
          "${UPLOAD_URL}?name=${FILE}"
        echo ""
      done
    - echo "✅ GitHub Release created with assets!"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Create GitLab Release
release:
  stage: release
  tags:
    - vps
  needs:
    - job: build
      artifacts: true
  script:
    # Get version from tag
    - export VERSION=${CI_COMMIT_TAG#v}
    - echo "Creating release for version $VERSION"

    # Extract changelog for this version
    - |
      if [ -f CHANGELOG.md ]; then
        # Try to extract section between [VERSION] and next [VERSION]
        CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')

        # If empty (no next version marker), get from version to end
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG=$(sed -n "/## \[$VERSION\]/,\$p" CHANGELOG.md)
        fi

        # Save to file
        echo "$CHANGELOG" > /tmp/changelog.txt
      else
        echo "No CHANGELOG.md found" > /tmp/changelog.txt
      fi

    # Create release description
    - |
      cat > /tmp/release_description.md << 'RELEASE_EOF'
      ## PolyTrans v${VERSION}

      ### 📦 Installation

      **For WordPress Installation (Recommended):**
      1. Download `polytrans.zip` ⬅️ Use this one!
      2. Upload to WordPress via Plugins > Add New > Upload Plugin
      3. Activate the plugin

      **For Archival/Version Tracking:**
      - Download `polytrans-${VERSION}.zip` if you need version-specific archive

      **Note:** Both ZIPs contain identical files. The `polytrans.zip` ensures WordPress installs the plugin in the correct `polytrans/` directory.

      ### ✅ What's Included

      - All plugin files
      - Composer dependencies (vendor/)
      - Production-optimized autoloader

      ### 🔐 Verification

      Verify the download integrity:
      ```bash
      # For WordPress installation:
      sha256sum -c polytrans.zip.sha256

      # For versioned archive:
      sha256sum -c polytrans-${VERSION}.zip.sha256
      ```

      ---

      RELEASE_EOF

    # Append changelog
    - cat /tmp/changelog.txt >> /tmp/release_description.md

    # Append footer
    - |
      cat >> /tmp/release_description.md << 'FOOTER_EOF'

      ---

      **Full Changelog:** [CHANGELOG.md](${CI_PROJECT_URL}/-/blob/main/CHANGELOG.md)
      FOOTER_EOF

    # Substitute variables in description
    - sed -i "s/\${VERSION}/$VERSION/g" /tmp/release_description.md
    - sed -i "s|\${CI_PROJECT_URL}|$CI_PROJECT_URL|g" /tmp/release_description.md

    - echo "Release description created:"
    - cat /tmp/release_description.md

    # Create GitLab Release via API (using Package Registry URLs - no job ID!)
    - |
      DESCRIPTION=$(cat /tmp/release_description.md)
      PKG_BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/polytrans"
      curl --fail --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"PolyTrans v${VERSION}\",
          \"tag_name\": \"${CI_COMMIT_TAG}\",
          \"description\": $(echo "$DESCRIPTION" | jq -Rs .),
          \"assets\": {
            \"links\": [
              {
                \"name\": \"polytrans.zip (WordPress Installation)\",
                \"url\": \"${PKG_BASE}/latest/polytrans.zip\",
                \"link_type\": \"package\"
              },
              {
                \"name\": \"polytrans.zip.sha256\",
                \"url\": \"${PKG_BASE}/latest/polytrans.zip.sha256\",
                \"link_type\": \"other\"
              },
              {
                \"name\": \"polytrans-${VERSION}.zip (Versioned Archive)\",
                \"url\": \"${PKG_BASE}/${VERSION}/polytrans-${VERSION}.zip\",
                \"link_type\": \"package\"
              },
              {
                \"name\": \"polytrans-${VERSION}.zip.sha256\",
                \"url\": \"${PKG_BASE}/${VERSION}/polytrans-${VERSION}.zip.sha256\",
                \"link_type\": \"other\"
              }
            ]
          }
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
    - echo "✅ GitLab Release created successfully!"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
